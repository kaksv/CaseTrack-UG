name: casetrack-ug

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: casetrack-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    ports:
      # Bound to loopback only — Caddy terminates HTTPS and proxies here.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
